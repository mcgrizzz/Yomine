name: PR test installers
run-name: 'Test installers for PR #${{ github.event.pull_request.number }} (${{ github.event.label.name }})'

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  select:
    if: contains(fromJSON('["test-build:windows","test-build:linux","test-build:macos","test-build:all"]'), github.event.label.name)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/github-script@v7
        id: platforms
        env:
          BUILD_LABEL: ${{ github.event.label.name }}
        with:
          script: |
            const selected = process.env.BUILD_LABEL.slice('test-build:'.length);
            const platforms = [
              { platform: 'windows', runner: 'windows-latest', args: '' },
              { platform: 'linux', runner: 'ubuntu-22.04', args: '' },
              { platform: 'macos', runner: 'macos-latest', args: '--target universal-apple-darwin' },
            ];
            core.setOutput('matrix', { include: platforms.filter(p => selected === 'all' || p.platform === selected) });

  build:
    needs: select
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libgtk-3-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22.x'
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: src-tauri/ui
      - name: Build test installers
        uses: tauri-apps/tauri-action@v0
        with:
          args: >-
            ${{ matrix.args }}
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ matrix.platform }}
          path: |
            target/**/bundle/**/*.msi
            target/**/bundle/**/*.exe
            target/**/bundle/**/*.dmg
            target/**/bundle/**/*.deb
            target/**/bundle/**/*.rpm
            target/**/bundle/**/*.AppImage
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.deb
            src-tauri/target/**/bundle/**/*.rpm
            src-tauri/target/**/bundle/**/*.AppImage
          retention-days: 30
          if-no-files-found: error
          overwrite: true
