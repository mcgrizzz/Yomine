name: Test build
run-name: Test build for PR #${{ inputs.pr_number }} (${{ inputs.platform }})

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number
      platform:
        description: Installers to build
        required: true
        type: choice
        default: windows
        options:
          - windows
          - linux
          - macos
          - all

permissions:
  contents: read

concurrency:
  group: test-build-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      repository: ${{ steps.pr.outputs.repository }}
      issues: ${{ steps.pr.outputs.issues }}
      matrix: ${{ steps.pr.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        id: pr
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          PLATFORM: ${{ inputs.platform }}
        with:
          script: |
            const { prepare } = require('./.github/scripts/test-builds.js');
            await prepare({ github, context, core });

  build:
    needs: prepare
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    cache-mode: none
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libgtk-3-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22.x'
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: src-tauri/ui
      - name: Build test installers
        uses: tauri-apps/tauri-action@v0
        with:
          args: >-
            ${{ matrix.args }}
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: pr-${{ inputs.pr_number }}-${{ needs.prepare.outputs.sha }}-${{ matrix.platform }}
          path: |
            target/**/bundle/**/*.msi
            target/**/bundle/**/*.exe
            target/**/bundle/**/*.dmg
            target/**/bundle/**/*.deb
            target/**/bundle/**/*.rpm
            target/**/bundle/**/*.AppImage
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.deb
            src-tauri/target/**/bundle/**/*.rpm
            src-tauri/target/**/bundle/**/*.AppImage
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  share:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          BUILD_SHA: ${{ needs.prepare.outputs.sha }}
          LINKED_ISSUES: ${{ needs.prepare.outputs.issues }}
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const { share } = require('./.github/scripts/test-builds.js');
            await share({ github, context, core });
