name: CodeQL

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      languages: ${{ steps.changes.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select languages to analyze
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            const { ALL_LANGUAGES, selectLanguages } = require('./.github/scripts/codeql-filter.js');
            if (context.eventName !== 'pull_request') return ALL_LANGUAGES;
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const languages = selectLanguages(files, pr.changed_files);
            core.info(languages.length ? `Analyzing: ${languages.join(', ')}.` : 'Only documentation, tests, or the workspace version changed.');
            return languages;

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: filter
    if: needs.filter.outputs.languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.filter.outputs.languages) }}
    env:
      # Exclude inline unit tests without excluding their production source files.
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_CFG_OVERRIDES: '-test'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
