[package]
name = "yomine-tauri"
version.workspace = true
description = "Yomine — Japanese sentence mining (Tauri + SvelteKit shell)"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "yomine_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["sync", "time", "macros"] }
# Dated default filename for the ignore-list export dialog (egui parity); unifies to
# the version the engine already compiles.
chrono = "0.4"
# Katakana→hiragana for furigana readings in the sentence DTO (matches the
# engine's version so only one copy is compiled).
wana_kana = "5.0.0"
yomine = { path = ".." }

