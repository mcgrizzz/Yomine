# Deinflection: the surface's dictionary form is recovered by ranking
# deinflection candidates against the frequency dictionaries — without a dict
# hit the term keeps UniDic's concatenated lemma (食べた → 食べるた, see
# core.toml). The synthetic dictionary below makes the correct lemmas findable.

frequencies = [
	{ term = "行く", reading = "いく", rank = 100 },
	{ term = "会う", reading = "あう", rank = 200 },
	{ term = "食べる", reading = "たべる", rank = 300 },
	{ term = "溺れる", reading = "おぼれる", rank = 4700 },
	{ term = "殺す", reading = "ころす", rank = 400 },
	{ term = "高い", reading = "たかい", rank = 250 },
	{ term = "助ける", reading = "たすける", rank = 500 },
	{ term = "助け", reading = "たすけ", rank = 100 },
	{ term = "使う", reading = "つかう", rank = 150 },
	{ term = "覚える", reading = "おぼえる", rank = 900 },
	{ term = "覚え", reading = "おぼえ", rank = 400 },
	{ term = "つまらない", reading = "つまらない", rank = 2455, kana = true },
	{ term = "つまる", reading = "つまる", rank = 2806, kana = true },
	{ term = "くだらない", reading = "くだらない", rank = 2500, kana = true },
	{ term = "くだる", reading = "くだる", rank = 2953, kana = true },
	{ term = "行ける", reading = "いける", rank = 2206 },
	{ term = "すまない", reading = "すまない", rank = 1900, kana = true },
	{ term = "すむ", reading = "すむ", rank = 464, kana = true },
	{ term = "分かる", reading = "わかる", rank = 40 },
	{ term = "なる", reading = "なる", rank = 30, kana = true },
	{ term = "なれる", reading = "なれる", rank = 1145, kana = true },
	{ term = "通じる", reading = "つうじる", rank = 2124 },
	{ term = "下さる", reading = "くださる", rank = 300 },
	{ term = "なさる", reading = "なさる", rank = 300, kana = true },
	{ term = "来る", reading = "くる", rank = 50 },
]

[[case]]
name = "past tense resolves to dictionary form"
text = "昨日は寿司を食べた。"
terms = [{ surface = "食べた", lemma = "食べる", reading = "たべる", pos = "Verb" }]

[[case]]
name = "polite volitional resolves to dictionary form"
text = "土曜日に会いましょう。"
terms = [{ surface = "会いましょう", lemma = "会う", reading = "あう", pos = "Verb" }]

[[case]]
name = "polite non-past resolves to dictionary form"
text = "学校に行きます。"
terms = [{ surface = "行きます", lemma = "行く", reading = "いく", pos = "Verb" }]

# て binds through intervening auxiliaries (溺れ+させ+て is one word), and the
# main-word policy keeps the verb's lemma even for chains the deinflector
# can't unwind.
[[case]]
name = "te-form after causative stays one word"
text = "彼女を溺れさせて殺した。"
terms = [
	{ surface = "溺れさせて", lemma = "溺れる", reading = "おぼれる", pos = "Verb" },
	{ surface = "殺した", lemma = "殺す", reading = "ころす", pos = "Verb" },
]

# ば binds onto 仮定形 like て onto 連用形.
[[case]]
name = "conditional ば merges into the adjective"
text = "高ければ買わない。"
terms = [{ surface = "高ければ", lemma = "高い", reading = "たかい" }]

[[case]]
name = "conditional ば merges through ない"
text = "食べなければならない。"
terms = [{ surface = "食べなければ", lemma = "食べる", reading = "たべる" }]

# だろう must not bind onto the verb, and a verb's lemma may not be the more
# frequent masu-stem noun (助け).
[[case]]
name = "passive+だろう: だろう splits off and lemma is the verb 助ける"
text = "魔法を使えば助けられるだろう"
terms = [
	{ surface = "使えば", lemma = "使う", reading = "つかう", pos = "Verb" },
	{ surface = "助けられる", lemma = "助ける", reading = "たすける", pos = "Verb" },
]
absent = ["助けられるだろう", "助け"]

# UniDic tags つまらない as 動詞つまる+ない, but the lexicalized negative is the
# dictionary word — the u-row verb guard must not force つまる.
[[case]]
name = "lexicalized negative つまらない keeps its own lemma"
text = "この映画はつまらなかった。"
terms = [{ surface = "つまらなかった", lemma = "つまらない", reading = "つまらない" }]

# The same holds for any i-adjective JMdict lists (くだらない, not くだる, "to descend"), but
# only in kana: with kanji, 行けない is 行く's potential ("can't go"), not いけない ("bad").
[[case]]
name = "kana verb + ない that spells a JMdict adjective is the adjective"
text = "くだらなかったな"
terms = [{ surface = "くだらなかった", lemma = "くだらない", reading = "くだらない", pos = "Adjective" }]

[[case]]
name = "colloquial ん for ない: すまん is the adjective すまない"
text = "待たせて すまんな"
terms = [{ surface = "すまん", lemma = "すまない", reading = "すまない", pos = "Adjective" }]

[[case]]
name = "colloquial ん on a verb that isn't an adjective: 分からん is 分かる"
text = "分からん"
terms = [{ surface = "分からん", lemma = "分かる", reading = "わかる" }]

[[case]]
name = "with kanji, 行けない stays the verb's negative potential"
text = "学校に行けない"
terms = [{ surface = "行けない", lemma = "行く", reading = "いく" }]

# UniDic files a potential form under the verb it comes from (なれる under 成る).
[[case]]
name = "a potential form cites its verb, in any conjugation"
text = "ポジティブにはなれんわ"
terms = [{ surface = "なれん", lemma = "なる", reading = "なる" }]

# UniDic files 通じる under the literary 通ずる; that isn't a potential form.
[[case]]
name = "a じる verb isn't read as a potential of its ずる lexeme"
text = "言葉の通じない猛獣だ"
terms = [{ surface = "通じない", lemma = "通じる", reading = "つうじる" }]

# Needs the なきゃ→ない rule from the jp-deinflector fork (btrkeks/jp-deinflector#8).
[[case]]
name = "なきゃ contraction deinflects to the dictionary form"
text = "覚えなきゃいけないことはたくさんあるからね"
terms = [{ surface = "覚えなきゃ", lemma = "覚える", reading = "おぼえる", pos = "Verb" }]
absent = ["覚え"]

[[case]]
name = "くだらなくて is the adjective くだらない, though UniDic reads it as くだる + ない"
text = "くだらなくて笑った"
terms = [{ surface = "くだらなくて", lemma = "くだらない", pos = "Adjective" }]

[[case]]
name = "an honorific verb's imperative is its own word"
text = "その本を下さい。早く寝なさい。いらっしゃいませ。"
terms = [
	{ surface = "下さい", lemma = "下さい", reading = "ください", pos = "Verb" },
	{ surface = "なさい", lemma = "なさい", reading = "なさい", pos = "Verb" },
	{ surface = "いらっしゃいませ", lemma = "いらっしゃいませ", reading = "いらっしゃいませ", pos = "Verb" },
]

[[case]]
name = "a plain imperative ending in い keeps its verb"
text = "こっちへ来い！"
terms = [{ surface = "来い", lemma = "来る", reading = "くる", pos = "Verb" }]
