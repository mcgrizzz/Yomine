# Phrase/compound promotion: adjacent words are promoted to one term when JMdict
# lists the result and a frequency list ranks it
# (phrases::judge). The synthetic dictionary supplies the ranks and readings. Compound readings in dictionaries carry
# rendaku (かいしゃ → がいしゃ), which the naive component concat lacks; the
# lookup tries voiced variants at component boundaries and adopts the reading
# that matched.

frequencies = [
	{ term = "聖杖", reading = "せいじょう", rank = 117103 },
	{ term = "こたび", reading = "こたび", rank = 46000, kana = true },
	{ term = "そうです", reading = "そうです", rank = 1000, kana = true },
	{ term = "に連れて", reading = "につれて", rank = 43358 },
	{ term = "からといって", reading = "からといって", rank = 2500, kana = true },
	{ term = "連れる", reading = "つれる", rank = 3000 },
	{ term = "株式会社", reading = "かぶしきがいしゃ", rank = 1000 },
	{ term = "株式", reading = "かぶしき", rank = 2000 },
	{ term = "会社", reading = "かいしゃ", rank = 300 },
	{ term = "土曜日", reading = "どようび", rank = 1000 },
	{ term = "土曜", reading = "どよう", rank = 4000 },
	{ term = "日", reading = "ひ", rank = 500 },
	{ term = "一筋縄", reading = "ひとすじなわ", rank = 8000 },
	{ term = "一筋", reading = "ひとすじ", rank = 9000 },
	{ term = "縄", reading = "なわ", rank = 7000 },
	{ term = "辺り一面", reading = "あたりいちめん", rank = 6000 },
	{ term = "辺り", reading = "あたり", rank = 1000 },
	{ term = "一面", reading = "いちめん", rank = 6000 },
	{ term = "丘", reading = "おか", rank = 2000 },
	{ term = "になると", reading = "になると", rank = 4000 },
	{ term = "手がかり", reading = "てがかり", rank = 3000 },
	{ term = "なる", reading = "なる", rank = 100, kana = true },
	{ term = "複合体", reading = "ふくごうたい", rank = 78145 },
	{ term = "複合", reading = "ふくごう", rank = 15917 },
	{ term = "体", reading = "たい", rank = 1401 },
	{ term = "中途半端", reading = "ちゅうとはんぱ", rank = 1000 },
	{ term = "中途", reading = "ちゅうと", rank = 20000 },
	{ term = "負けじと", reading = "まけじと", rank = 30000 },
	{ term = "負け", reading = "まけ", rank = 3000 },
	{ term = "半端", reading = "はんぱ", rank = 15000 },
	{ term = "相変わらず", reading = "あいかわらず", rank = 1000 },
	{ term = "変わる", reading = "かわる", rank = 500 },
	{ term = "気になる", reading = "きになる", rank = 3000 },
	{ term = "気", reading = "き", rank = 200 },
	{ term = "水を飲む", reading = "みずをのむ", rank = 5000 },
	{ term = "水", reading = "みず", rank = 300 },
	{ term = "飲む", reading = "のむ", rank = 400 },
	{ term = "ついでに", reading = "ついでに", rank = 1821, kana = true },
	{ term = "ついで", reading = "ついで", rank = 3929, kana = true },
	{ term = "あなたに", reading = "あなたに", rank = 2000, kana = true },
	{ term = "あなた", reading = "あなた", rank = 100, kana = true },
	{ term = "そのとおり", reading = "そのとおり", rank = 12000, kana = true },
	{ term = "何度も", reading = "なんども", rank = 2000 },
	{ term = "それに", reading = "それに", rank = 1000, kana = true },
	{ term = "その", reading = "その", rank = 500, kana = true },
	{ term = "とおり", reading = "とおり", rank = 600, kana = true },
	{ term = "気をつける", reading = "きをつける", rank = 900 },
	{ term = "つける", reading = "つける", rank = 300 },
	{ term = "映画監督", reading = "ええがかんとく", rank = 30440 },
	{ term = "映画", reading = "えいが", rank = 900 },
	{ term = "監督", reading = "かんとく", rank = 3000 },
	{ term = "表沙汰", reading = "おもてざた", rank = 26427 },
	{ term = "気にかける", reading = "きにかける", rank = 6082 },
	{ term = "にかけて", reading = "にかけて", rank = 3776, kana = true },
	{ term = "表", reading = "ひょう", rank = 1554 },
	{ term = "沙汰", reading = "さた", rank = 8815 },
