[[case]]
name = "rendaku compound promoted with the corrected reading"
text = "株式会社で働いています。"
terms = [{ surface = "株式会社", reading = "かぶしきがいしゃ", pos = "NounExpression" }]
absent = ["株式", "会社"]

# 3-char compounds are promoted only when every component is a noun and the
# surface is all kanji (min_len drops from 4 to 3 for that shape).
[[case]]
name = "3-char all-kanji noun compound is promoted"
text = "土曜日に会いましょう。"
terms = [{ surface = "土曜日", reading = "どようび", pos = "NounExpression" }]

[[case]]
name = "一筋縄 is promoted"
text = "やはり一筋縄ではいかないか"
terms = [{ surface = "一筋縄", reading = "ひとすじなわ", pos = "NounExpression" }]

[[case]]
name = "辺り一面 is promoted"
text = "さっきまで辺り一面丘だったのに"
terms = [{ surface = "辺り一面", reading = "あたりいちめん", pos = "NounExpression" }]

# A rare compound of common parts (score/ratio would reject it) still
# promotes: all-kanji noun compounds trust the dictionary reading match alone.
[[case]]
name = "複合体 is promoted despite common components"
text = "頭脳の新しい受容器の複合体を識別する。"
terms = [{ surface = "複合体", reading = "ふくごうたい", pos = "NounExpression" }]

# A dictionary carrying junk n-gram "phrases" must not force them on us: a
# phrase may not start or end on a particle.
[[case]]
name = "になると is not pulled out as a phrase"
text = "ココの存在が手がかりになると思っていたけど"
absent = ["になると"]

# Dictionaries key entries by citation form: a span ending in a conjugated
# word (半端+な, なっ+た) matches via the trailing term's lemma.
[[case]]
name = "な-bound adjectival compound mines the citation-form lemma"
text = "中途半端な動きをした"
terms = [{ surface = "中途半端な", lemma = "中途半端", reading = "ちゅうとはんぱ", pos = "AdjectivalNoun" }]
absent = ["中途半端な動き", "半端", "中途"]

[[case]]
name = "conjugated verb tail matches via citation form"
text = "彼のことが気になった。"
terms = [{ surface = "気になった", lemma = "気になる", pos = "Expression" }]

[[case]]
name = "相変わらず promotes and suppresses its stranded prefix"
text = "相変わらずひどいこと言うなぁ"
terms = [{ surface = "相変わらず", lemma = "相変わらず", reading = "あいかわらず", pos = "Adverb" }]
absent = ["相"]

# JMdict lists 気になる, so it reads as one unit despite the particle.
[[case]]
name = "JMdict phrase hides its components across a particle"
text = "彼のことが気になる。"
terms = [{ surface = "気になる", pos = "Expression" }]
absent = ["気", "なる"]

# JMdict has no 水を飲む: a free combination stays its component words.
[[case]]
name = "unlisted particle-containing phrase keeps its components"
text = "水を飲む。"
terms = [
	{ surface = "水", lemma = "水" },
	{ surface = "飲む", lemma = "飲む" },
]
absent = ["水を飲む"]

# Frequency lists keep particle n-grams; JMdict lists only real ones (ついでに).
[[case]]
name = "phrase ending in a particle needs a JMdict listing"
text = "ついでにあなたに聞く。"
terms = [{ surface = "ついでに", pos = "Adverb" }]
absent = ["ついで", "あなたに"]

# UniDic mis-lexicalizes 負けじと as 負け+じと(副詞); じと validates in no
# dictionary, which waives the frequency/ratio gates for the corroborated phrase.
[[case]]
name = "負けじと promoted over the mis-tokenized 負け+じと"
text = "私は客の出す音に圧倒されながらも、負けじと、「いらっしゃいませ」"
terms = [{ surface = "負けじと", lemma = "負けじと", reading = "まけじと", pos = "Adverb" }]
absent = ["負け", "じと"]

# Dictionaries spell an interior を as を; read as pronounced (お) it never matches.
[[case]]
name = "phrase with an interior を matches its dictionary reading"
text = "気をつけて。"
terms = [{ surface = "気をつけて", lemma = "気をつける", reading = "きをつける", pos = "Expression" }]

# BCCWJ writes readings as pronounced (映画監督 as ええがかんとく).
[[case]]
name = "pronounced-style dictionary reading still matches"
text = "彼は映画監督です。"
terms = [{ surface = "映画監督", pos = "NounExpression" }]

# UniDic reads 表 as ひょう here; the compound is only ever おもてざた.
[[case]]
name = "compound takes its only dictionary reading over the split reading"
text = "表沙汰にはできない。"
terms = [{ surface = "表沙汰", reading = "おもてざた", pos = "NounExpression" }]
absent = ["表", "沙汰"]

# Its common parts would fail the frequency gates, but JMdict lists the phrase.
[[case]]
name = "JMdict phrase passes the frequency gates"
text = "そのとおりです。"
terms = [{ surface = "そのとおり", pos = "Expression" }]
absent = ["とおり"]

[[case]]
name = "a three-character JMdict phrase with a kanji is promoted"
text = "何度も往復した。"
terms = [{ surface = "何度も", pos = "Adverb" }]

# JMdict lists それに, but in kana three characters are usually just two words.
[[case]]
name = "a three-character kana JMdict phrase is not promoted"
text = "それにする。"
absent = ["それに"]

# にかけて is a JMdict phrase too, but inside 気にかける it is no unit of its own.
[[case]]
name = "a phrase that hides its words hides phrases inside it"
text = "いつも気にかけてくださる。"
terms = [{ surface = "気にかけて", lemma = "気にかける", pos = "Expression" }]
absent = ["にかけて"]

# A phrase opening with a particle (につれて) ends its clause; a verb going on into a helper
# verb (連れていく) is a verb.
[[case]]
name = "a verb chain is not a compound particle"
text = "あなたの旅に連れていってくれませんか？"
absent = ["に連れて"]

[[case]]
name = "a compound particle may end a clause before an ordinary verb"
text = "魔王を倒したからといって終わりじゃない"
terms = [{ surface = "からといって" }]

# UniDic splits 聖杖 into 聖 + 杖; a JMdict word all in kanji may be two characters.
[[case]]
name = "a two-kanji JMdict word split by UniDic is one term"
text = "聖杖の証じゃ 無理だよね？"
terms = [{ surface = "聖杖" }]
absent = ["聖"]

# UniDic splits こたび into こた + び; JMdict writes it only with the rare kanji 此度.
[[case]]
name = "a kana word JMdict spells only with rare kanji is one term"
text = "こたびは よくぞ魔王を打ち倒した"
terms = [{ surface = "こたび" }]
absent = ["こた", "び"]

# The そう of appearance (できそう) belongs to the verb; JMdict's そうです is the adverb そう.
[[case]]
name = "そうです after a verb stem is not the interjection"
text = "長生きできそうです"
absent = ["そうです"]
