# Core segmentation: word splits, readings, POS — no frequency data, so
# deinflection keeps UniDic lemmas and no phrases are promoted.

[[case]]
name = "plain sentence: splits, readings, POS"
text = "昨日は寿司を食べた。"
segments = [
	{ surface = "昨日", reading = "きのう", pos = "Noun" },
	{ surface = "は", reading = "は", pos = "Postposition" },
	{ surface = "寿司", reading = "すし", pos = "Noun" },
	{ surface = "を", reading = "を", pos = "Postposition" },
	{ surface = "食べた", reading = "たべた", pos = "Verb" },
	{ surface = "。", pos = "Symbol" },
]
terms = [
	{ surface = "昨日", lemma = "昨日", reading = "きのう", pos = "Noun" },
	{ surface = "寿司", lemma = "寿司", reading = "すし", pos = "Noun" },
]

[[case]]
name = "compound NOT promoted without frequency data"
text = "土曜日に会いましょう。"
segments = [
	{ surface = "土曜", reading = "どよう", pos = "Noun" },
	{ surface = "日", reading = "ひ", pos = "Noun" },
	{ surface = "に", pos = "Postposition" },
	{ surface = "会いましょう", reading = "あいましょう", pos = "Verb" },
	{ surface = "。", pos = "Symbol" },
]
absent = ["土曜日"]

[[case]]
name = "な-adnominal おかしな is adjectival, こんな stays a determiner"
text = "こんな話はおかしなことだ"
terms = [
	{ surface = "おかしな", lemma = "おかしな", pos = "AdjectivalNoun" },
	{ surface = "こんな", lemma = "こんな", pos = "Determiner" },
]

# UniDic reads a lone フン as the Huns, and offers 感動詞 for any unknown katakana
# word, so only a dictionary interjection entry retags a standalone name.
[[case]]
name = "lone katakana exclamations are interjections, names stay names"
text = "フン！ンン…エリス！"
terms = [
	{ surface = "フン", pos = "Interjection" },
	{ surface = "ンン", pos = "Interjection" },
	{ surface = "エリス", pos = "ProperNoun" },
]

# Readings stay as written; only comparisons fold long vowels (おおきい, not おうきい).
[[case]]
name = "readings keep their written long vowels"
text = "大きいお姉さん"
terms = [{ surface = "大きい", reading = "おおきい" }]
