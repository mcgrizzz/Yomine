# Colloquial forms UniDic reads correctly but the engine then mines as the wrong word. Found in
# auto-mined Frieren cards; ranks from JPDB. Frequency lists carry すん (寸) and ぶっ as words of
# their own, so the surface can outrank UniDic's dictionary form.

frequencies = [
	{ term = "する", reading = "する", rank = 11, kana = true },
	{ term = "すん", reading = "すん", rank = 152734, kana = true },
	{ term = "どう", reading = "どう", rank = 85, kana = true },
	{ term = "の", reading = "の", rank = 1, kana = true },
	{ term = "さ", reading = "さ", rank = 87, kana = true },
	{ term = "いい", reading = "いい", rank = 33, kana = true },
	{ term = "子", reading = "こ", rank = 207 },
	{ term = "いい子", reading = "いいこ", rank = 3984 },
	{ term = "いい子ぶる", reading = "いいこぶる", rank = 52420 },
	{ term = "ぶる", reading = "ぶる", rank = 4738, kana = true },
	{ term = "ぶっ", reading = "ぶっ", rank = 8802, kana = true },
	{ term = "きる", reading = "きる", rank = 1113, kana = true },
	{ term = "きれる", reading = "きれる", rank = 2484, kana = true },
	{ term = "キレる", reading = "きれる", rank = 9721, kana = true },
	{ term = "ぼく", reading = "ぼく", rank = 3878, kana = true },
	{ term = "ボケる", reading = "ぼける", rank = 12598, kana = true },
]

[[case]]
name = "すん is する's contraction, not 寸"
text = "でも こんなの解読して どうすんのさ"
terms = [{ surface = "すん", lemma = "する", reading = "する" }]

[[case]]
name = "ぶった is the suffix ぶる, not a word ぶっ"
text = "今さら いい子ぶったって"
absent = ["ぶっ"]

# The deinflector writes a katakana verb in hiragana, and the potential reading (きれる as
# きる's) is the commoner word.
[[case]]
name = "キレちゃった is キレる, not きる"
text = "それで フェルンが キレちゃったの"
terms = [{ surface = "キレちゃった", lemma = "キレる", reading = "きれる" }]

[[case]]
name = "ボケた is ボケる, not ぼく"
text = "まだ ボケたふり 続けているの？"
terms = [{ surface = "ボケた", lemma = "ボケる", reading = "ぼける" }]

# UniDic reads んな as そんな everywhere; after a verb it is るな with る contracted.
[[case]]
name = "んな after a verb is the prohibitive な"
text = "あのな 何度も言わせんな"
terms = [{ surface = "んな", lemma = "な", pos = "Postposition" }]

[[case]]
name = "んな before a noun is still そんな"
text = "んなもん 俺だって用意してねえよ"
terms = [{ surface = "んな", lemma = "んな" }]

# UniDic's best parse is か + い, two sentence-final particles, before が.
[[case]]
name = "かい before が is 甲斐, not か + い"
text = "待ったかいがありました"
absent = ["い"]

# UniDic splits どうしたんだい as し + たんだい (短大); the 1-best path joining a kana noun to a
# verb stem is a misparse (Apothecary Diaries S01E05).
[[case]]
name = "a kana noun after a verb stem takes another path"
text = "今日は どうしたんだい？"
absent = ["たんだい"]
